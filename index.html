<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ・ウェブページ</title>
    <style>
        /* 簡単な見た目の調整（CSS） */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        img {
        max-width: 100%; /* 親要素の幅を超えないようにする */
        height: auto;    /* 縦横比を維持する */
        display: block;  /* 下に謎の隙間ができるのを防ぐ（おまじない） */
        margin: 10px 0;  /* 上下に少し余白を作る（お好みで） */
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #777;
        }
        /* imgのところに video も追加します */
        img, video {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 10px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>ガレージ</h1>
    </header>

    <main>
        <h2>一覧</h2>
        <img src="img/MMK_shinjyukuhankagai.png">
        <video src="img/rain.mp4" controls muted loop playsinline>
        お使いのブラウザは動画タグをサポートしていません。
        </video>
        <img src="img/3.png">
        <img src="img/1.png">
        <video src="img/2.mkv" controls muted loop playsinline>
        お使いのブラウザは動画タグをサポートしていません。
        </video>

        <video src="img/0001-0250.mp4" controls muted loop playsinline>
        お使いのブラウザは動画タグをサポートしていません。
        </video>
        <audio controls>
        <source src="img/kaguya_cleaned.wav" type="audio/wav">
        </audio>

        



        <h2>お問い合わせ</h2>
        <p>詳細は以下のリンクからご確認ください。</p>
        <a href="https://www.google.com">Googleで検索する</a>
    </main>

    <footer>
        <p>&copy; 2026 Web開発の学習</p>
    </footer>

</body>
</html>
