<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ・ウェブページ</title>
    <style>
        /* 簡単な見た目の調整（CSS） */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <h1>ようこそ、私のウェブサイトへ</h1>
    </header>

    <main>
        <h2>自己紹介</h2>
        <p>これはHTML5で作成された基本的なウェブページのサンプルです。ここには自由にテキストを書くことができます。</p>
        
        <h3>学習中の技術</h3>
        <ul>
            <li>HTML5（構造）</li>
            <li>CSS3（デザイン）</li>
            <li>JavaScript（動き）</li>
        </ul>

        <h2>お問い合わせ</h2>
        <p>詳細は以下のリンクからご確認ください。</p>
        <a href="https://www.google.com">Googleで検索する</a>
    </main>

    <footer>
        <p>&copy; 2026 Web開発の学習</p>
    </footer>

</body>
</html>
